[project]
name = "ml-project"
version = "0.1.0"
description = "Шаблон окружения для ML-проектов"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = [
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
    "plotly",
]
service = [
    "fastapi",
    "uvicorn[standard]",
    "gradio",
]
jupyter = [
    "jupyter",
    "ipython",
]
all = ["ml-project[ml,service,jupyter]"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
